name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m rag_evidence_lab examples/demo.json --html report.html --json report.json --max-flagged 3
      - run: python -m rag_evidence_lab examples/demo.json --baseline report.json
      - run: python -m pip install .
      - run: rag-evidence examples/demo.json --max-flagged 3
