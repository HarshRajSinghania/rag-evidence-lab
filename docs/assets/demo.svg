<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-label="Example: 30-day claim has no flags; 90-day claim is flagged for an unmatched number">
<rect width="1200" height="390" rx="20" fill="#0e1424"/>
<g font-family="Arial, sans-serif"><text x="40" y="50" fill="#c3ccdf" font-size="18">SAME SOURCE. ONE NUMBER CHANGES.</text>
<rect x="40" y="78" width="1120" height="80" rx="12" fill="#182136"/><text x="65" y="111" fill="#86d7cc" font-size="14">RETRIEVED POLICY</text><text x="65" y="140" fill="#e7edf8" font-size="22">Refunds are available within 30 days of purchase.</text>
<rect x="40" y="180" width="544" height="154" rx="12" fill="#182136"/><text x="65" y="216" fill="#e7edf8" font-size="20">Answer: 30 days [policy]</text><text x="65" y="258" fill="#86d7cc" font-size="24">No heuristic flags</text><text x="65" y="301" fill="#c3ccdf" font-size="16">Still verify meaning and scope.</text>
<rect x="610" y="180" width="550" height="154" rx="12" fill="#182136"/><text x="635" y="216" fill="#e7edf8" font-size="20">Answer: 90 days [policy]</text><text x="635" y="258" fill="#ffc48b" font-size="24">unmatched_number: 90</text><text x="635" y="301" fill="#c3ccdf" font-size="16">Review the claim against its cited evidence.</text>
<text x="40" y="370" fill="#8f9db9" font-size="14">Synthetic example from examples/demo.json • Surface checks are not semantic factuality scores.</text></g></svg>
